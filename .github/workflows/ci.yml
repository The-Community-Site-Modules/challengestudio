name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest

    # Job-level, not step-level. `postinstall` runs `prisma generate`, which
    # loads prisma.config.ts, which throws if DIRECT_URL is unset — so these
    # must already exist during `pnpm install`, not just at build time.
    # CI never reaches a database: DATABASE_URL is read at request time, and
    # `prisma generate` only needs the value to be present, not reachable.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: sb_secret_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build
